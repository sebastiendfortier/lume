[workspace]
resolver = "2"
members = [
    "crates/lume-core",
    "crates/lume-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-or-later"
authors = ["Sebastien Fortier"]
repository = "https://github.com/sebastiendfortier/lume"
homepage = "https://github.com/sebastiendfortier/lume"
description = "Pixel-rendered and ANSI terminal Markdown viewer & live two-pane editor for WezTerm, Kitty, and Ghostty"
keywords = ["markdown", "terminal", "tui", "kitty-graphics", "wezterm"]
categories = ["command-line-utilities", "text-processing"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
