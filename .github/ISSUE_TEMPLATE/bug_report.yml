name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `...`
        2. Observe `...`
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version, OS, and terminal
      placeholder: "e.g. v0.1.0, Ubuntu 24.04 x86_64, WezTerm"
    validations:
      required: true
